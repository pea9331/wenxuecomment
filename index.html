<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="文学问答，围绕作品提问，交流不同的读法。">
<title>文学问答</title>
<style>
:root{color-scheme:light;--paper:#f7f6f2;--ink:#292d29;--muted:#72766d;--line:#dedfd6;--green:#475b47}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Microsoft YaHei",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
header{max-width:1120px;margin:auto;padding:24px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:16px;flex-wrap:wrap}
.brand{font-family:Georgia,"Songti SC",serif;font-size:23px;font-weight:600;letter-spacing:2px}
nav{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
nav button{border:0;background:none;padding:8px 0;color:var(--muted)}
main{max-width:1000px;margin:auto;padding:70px 32px 40px}
.hero{max-width:690px;margin:0 auto 62px}
h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(29px,5vw,42px);line-height:1.4;font-weight:500;margin:0 0 25px}
.search{display:flex;background:white;border:1px solid #bfc5b8;border-radius:8px;padding:6px;gap:8px}
.search:focus-within{outline:2px solid #a7b6a1;outline-offset:2px}
.search input{min-width:0;flex:1;border:0;background:none;padding:10px 12px;outline:none;color:var(--ink)}
.primary{background:var(--green);color:white;border:1px solid var(--green);border-radius:5px;padding:9px 19px}
.progress{font-size:13px;color:var(--muted);margin:10px 0 0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:48px}
.section-heading{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:17px;gap:15px}
h2{font-size:19px;font-weight:550;margin:0}
.empty{padding:48px 0 58px}
.empty h3{font-size:20px;font-weight:500;margin:0 0 10px}
.empty p{color:var(--muted);margin:0 0 22px;max-width:440px}
aside{border-left:1px solid var(--line);padding-left:26px}
aside p{font-size:14px;color:var(--muted);margin:12px 0 24px}
aside button{border:1px solid var(--line);border-radius:5px;background:transparent;padding:8px 15px;color:var(--ink)}
footer{max-width:1120px;margin:45px auto 0;padding:22px 32px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
dialog{max-width:440px;width:calc(100% - 40px);border:1px solid var(--line);border-radius:10px;padding:28px;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:#17231766}
dialog h2{margin-bottom:12px}
dialog p{color:var(--muted)}
dialog form{text-align:right;margin-top:22px}
button:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:5px}
#hash-notice{display:none;background:#fff8e8;border:1px solid #e6d7b0;border-radius:6px;padding:12px 16px;margin:0 0 24px;font-size:14px;color:#5a4a2a}
#hash-notice a{color:var(--green);text-decoration:underline;margin-left:8px}
@media(max-width:650px){header{padding:18px 20px;align-items:flex-start;gap:12px}nav{gap:14px;font-size:13px}main{padding:44px 20px 20px}.hero{margin-bottom:42px}.layout{grid-template-columns:1fr;gap:25px}aside{border-left:0;border-top:1px solid var(--line);padding:22px 0 0}.search input{font-size:14px;padding:10px 7px}.primary{padding:9px 13px}.empty{padding:32px 0}footer{padding:20px;margin-top:30px}}
@media(max-width:360px){header{flex-direction:column;align-items:flex-start;gap:8px}nav{gap:12px}.brand{font-size:20px}}
</style>
<link rel="stylesheet" href="./account.css?v=20261118b">
</head>
<body>
<header>
<a class="brand" href="./">文学问答</a>
<nav aria-label="主导航"><button type="button" data-share-page>分享</button><a href="./" aria-current="page">问题</a><a href="./profile.html">我的主页</a><button type="button" data-feature="登录与注册">登录 / 注册</button></nav>
</header>
<main>
<div id="hash-notice" role="status">该内容不存在或已删除。<a href="#" id="return-home">返回首页</a></div>
<section class="hero" aria-labelledby="heading">
<h1 id="heading">读到这里，你有什么疑问？</h1>
<form class="search" role="search" id="search-form">
<input id="query" name="q" type="search" maxlength="120" aria-label="搜索书名、问题或关键词" placeholder="搜索书名、问题或关键词">
<button class="primary" type="submit">搜索</button>
</form>
<p class="progress">提问和搜索正在接入</p>
</section>
<div class="layout">
<section aria-labelledby="questions-heading">
<div class="section-heading"><h2 id="questions-heading">最近的问题</h2><button class="primary" type="button" data-feature="发布问题">提个问题</button></div>
<div class="empty"><h3>这里等着第一个问题</h3><p>可以问一个人物为什么这样做，也可以聊聊哪一段让你读不下去。</p><button type="button" class="primary" data-feature="发布问题">写下你的疑问</button></div>
</section>
<aside aria-labelledby="saved-heading"><h2 id="saved-heading">我的收藏</h2><p>收藏想继续读的讨论，之后在这里找到。</p><button type="button" data-feature="收藏">查看收藏</button></aside>
</div>
</main>
<footer>文学问答 · 首页预览版</footer>
<dialog id="notice" aria-labelledby="notice-title"><h2 id="notice-title"></h2><p id="notice-text"></p><form method="dialog"><button class="primary" id="notice-ok">知道了</button></form></dialog>
<script>
const notice = document.getElementById('notice');
const hashNotice = document.getElementById('hash-notice');
const returnHome = document.getElementById('return-home');
let lastFocus = null;

function showProgress(title, message) {
  lastFocus = document.activeElement;
  document.getElementById('notice-title').textContent = title;
  document.getElementById('notice-text').textContent = message;
  notice.showModal();
  document.getElementById('notice-ok').focus();
}

notice.addEventListener('close', () => {
  if (lastFocus && typeof lastFocus.focus === 'function') {
    lastFocus.focus();
  }
  lastFocus = null;
});

document.querySelectorAll('[data-feature]').forEach(button => {
  if (['个人主页', '登录与注册'].includes(button.dataset.feature)) return;
  button.addEventListener('click', () => {
    const feature = button.dataset.feature;
    showProgress(feature + '正在接入', '当前完成了首页布局。此功能接通后，你可以在这里' + ({'个人主页':'查看自己的资料和讨论。','登录与注册':'登录并建立站内账号。','发布问题':'填写并发布问题。','收藏':'找回收藏过的讨论。'}[feature]));
  });
});

document.getElementById('search-form').addEventListener('submit', event => {
  event.preventDefault();
  const query = document.getElementById('query').value.trim();
  if (!query) {
    document.getElementById('query').focus();
    return;
  }
  showProgress('搜索正在接入', '问题数据库接通后，可以搜索“' + query + '”相关的问题。');
});

function checkHash() {
  const hash = location.hash.slice(1);
  if (hash) {
    hashNotice.style.display = 'block';
  } else {
    hashNotice.style.display = 'none';
  }
}

returnHome.addEventListener('click', e => {
  e.preventDefault();
  history.replaceState(null, '', location.pathname + location.search);
  checkHash();
});

window.addEventListener('hashchange', checkHash);
checkHash();
</script>

<dialog id="account-dialog" aria-labelledby="account-title">
<h2 id="account-title">登录</h2>
<p id="account-status" role="status" aria-live="polite"></p>
<section id="credentials-view">
<form id="credentials-form">
<label>邮箱<input id="account-email" type="email" autocomplete="email" required maxlength="254"></label>
<label>密码<input id="account-password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"></label>
<div class="account-actions"><button id="account-submit" class="primary">登录</button><button id="account-toggle" class="secondary" type="button">创建账号</button></div>
</form>
</section>
<section id="profile-view" hidden>
<p id="account-email-display"></p>
<form id="profile-form">
<label>昵称<input id="profile-nickname" required maxlength="24" autocomplete="nickname"></label>
<label>简介<textarea id="profile-bio" maxlength="240"></textarea></label>
<button class="primary" id="profile-save">保存资料</button>
</form>
<div class="account-actions"><button class="secondary" id="account-signout" type="button">退出登录</button></div>
</section>
<form method="dialog"><button class="secondary">关闭</button></form>
</dialog>
<script src="./config.js" defer></script>
<script src="./vendor/supabase.js" defer></script>
<script src="./account.js?v=20261118b" defer></script>
<script src="./share.js?v=20261118b" defer></script>
</body>
</html>
